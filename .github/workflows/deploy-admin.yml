name: Deploy Admin Panel to Timeweb

on:
  push:
    branches: [main]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            admin-panel/frontend/package-lock.json
            admin-panel/backend/package-lock.json

      # --- Frontend ---
      - name: Install frontend dependencies
        working-directory: admin-panel/frontend
        run: npm ci

      - name: Build frontend
        working-directory: admin-panel/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.ADMIN_API_URL }}

      # --- Backend ---
      - name: Install backend dependencies
        working-directory: admin-panel/backend
        run: npm ci

      - name: Build backend
        working-directory: admin-panel/backend
        run: npm run build

      # --- Упаковываем всё в один архив ---
      - name: Package artifacts
        run: |
          mkdir -p deploy/frontend deploy/backend
          cp -r admin-panel/frontend/dist/. deploy/frontend/
          cp -r admin-panel/backend/dist/. deploy/backend/dist/
          cp admin-panel/backend/package.json deploy/backend/
          cp admin-panel/backend/package-lock.json deploy/backend/
          tar -czf deploy.tar.gz deploy/

      # --- Копируем архив на сервер ---
      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy.tar.gz
          target: /tmp/

      # --- Распаковываем и запускаем ---
      - name: Deploy and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            tar -xzf /tmp/deploy.tar.gz -C /tmp/
            rm -rf /opt/businitti-admin/frontend
            cp -r /tmp/deploy/frontend /opt/businitti-admin/frontend
            rm -rf /opt/businitti-admin/backend/dist
            cp -r /tmp/deploy/backend/dist /opt/businitti-admin/backend/dist
            cp /tmp/deploy/backend/package.json /opt/businitti-admin/backend/package.json
            cp /tmp/deploy/backend/package-lock.json /opt/businitti-admin/backend/package-lock.json
            rm -rf /tmp/deploy /tmp/deploy.tar.gz
            cd /opt/businitti-admin/backend
            npm ci --omit=dev
            pm2 restart businitti-admin || pm2 start dist/server.js --name businitti-admin
            pm2 save
