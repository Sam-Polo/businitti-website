# Сжатие ответов для всех сайтов на сервере.
# Положить в /etc/nginx/conf.d/gzip.conf. `gzip on;` уже есть в стандартном
# /etc/nginx/nginx.conf Ubuntu, а вот типы там закомментированы — без этого файла
# сжимается только HTML, а JS-бандл и JSON API уходят как есть (в ~3 раза тяжелее).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
