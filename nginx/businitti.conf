# HTTP → HTTPS редирект
server {
    listen 80;
    server_name businitti.ru www.businitti.ru;
    return 301 https://businitti.ru$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name businitti.ru www.businitti.ru;

    ssl_certificate     /etc/letsencrypt/live/businitti.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/businitti.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/businitti-website;
    index index.html;

    # SPA — все маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Отключаем логирование favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
