server {
    listen 80;
    server_name 194.67.122.110;

    root /opt/businitti-website;
    index index.html;

    # SPA — все маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Отключаем логирование favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
